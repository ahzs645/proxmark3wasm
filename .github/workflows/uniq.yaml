name: Check uniq keys

on:
  push:
    branches: [master]
    paths:
      - 'client/dictionaries/**'
      - 'client/resources/*.json'
      - 'tools/check_json_uniq.py'
  pull_request:
    paths:
      - 'client/dictionaries/**'
      - 'client/resources/*.json'
      - 'tools/check_json_uniq.py'
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-unique:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: check unique keys in dic files
        shell: bash
        run: |
          find . -type f -name "*.dic" | xargs -I {} sh -c "echo {} && cat {} | sed 's/ *#.*//;/^$/d' | sed 's/\(.*\)/\U\1/' | sort | uniq -i -d -c | sort -n -r "
          if [[ $(find . -type f -name "*.dic" | xargs -I {} sh -c "echo {} && cat {} | sed 's/ *#.*//;/^$/d' | sed 's/\(.*\)/\U\1/' | sort | uniq -i -d -c | sort -n -r " | grep -v '^\./' | wc -l) -gt 0 ]]; then exit 1; fi

      - name: check unique AIDs in resource json files
        shell: bash
        run: python3 tools/check_json_uniq.py
